<!DOCTYPE html>
<html>
<head>
    <title>World Clock</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>World Clock</h1>
    <div class="clock-container">
        <canvas id="analog-clock" class="clock" width="250" height="250"></canvas>
    </div>
    <div class="controls">
        <select id="countrySelect">
            <option value="">Select a country</option>
        </select>
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
        <button onclick="toggleFullscreen()">Fullscreen</button>
        <button onclick="addMultiClock()">Thêm múi giờ</button>
    </div>
    <div id="query-history" style="margin:10px 0;"></div>
    <div id="multi-clocks" style="margin: 20px 0;"></div>
    <div id="map" style="height: 400px;"></div>
    <div id="time" style="margin: 20px auto; text-align: center; font-size: 18px;"></div>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
